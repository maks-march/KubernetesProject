# GatewayClass: объявляет, что Gateway'ы класса eg обслуживает Envoy Gateway.
# controllerName — фиксированное значение контроллера Envoy Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

---
# Gateway: слушатель на порту 80.
# Envoy Gateway создаёт для него Service типа LoadBalancer,
# IP выдаёт MetalLB.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same       # HTTPRoute должен лежать в том же namespace

---
# HTTPRoute: все запросы с пути / отправляются в Service nginx.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-route
spec:
  parentRefs:
    - name: app-gateway    # привязка к Gateway выше
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx      # Service приложения (k8s/nginx-service.yaml)
          port: 80
