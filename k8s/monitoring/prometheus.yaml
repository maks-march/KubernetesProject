# Мониторинг: Prometheus + node-exporter.
# Prometheus скрейпит node-exporter (метрики ноды) и сам себя.
# Проверка: port-forward и запрос up{job="node-exporter"} = 1.

# Конфигурация Prometheus: цели сбора метрик
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # сам Prometheus (счётчики запросов, память)
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # метрики ноды кластера: CPU, память, диск, сеть
      - job_name: node-exporter
        static_configs:
          - targets: ["node-exporter.monitoring.svc.cluster.local:9100"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}          # данные живут пока жив под (см. ограничения в README)
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
